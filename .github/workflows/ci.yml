# Quality gates: format, lint, typecheck, knip, test, security, build, e2e, lighthouse.
#
# Triggers (avoids double runs on main → release promote PRs):
# - pull_request → main: feature-branch PRs
# - push → main / release: direct pushes and merges (including promote merge to release)
name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release]

concurrency:
  cancel-in-progress: true
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies (husky)
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci --legacy-peer-deps

      - name: Format (ESLint --fix)
        run: make format

      - name: Lint
        run: make lint-ci

      - name: Typecheck
        run: make typecheck

      - name: Knip (unused files / deps)
        run: make knip

      - name: Test (with coverage thresholds)
        run: make test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: coverage-report
          path: web/coverage/

      - name: Security
        run: make security

      - name: Build web
        run: make build

      - name: E2E smoke (Cypress)
        run: make e2e

      - name: Lighthouse CI (next start)
        run: cd web && npm run lighthouse

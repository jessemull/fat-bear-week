# CI: Lint, test, security, and build on PR and push to main/release.
name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

jobs:
  # Required pre-merge: lint, test, security, build.
  lint-test-security-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci --legacy-peer-deps

      - name: Format (ESLint --fix)
        run: make format

      - name: Lint
        run: make lint-ci

      - name: Test (with coverage)
        run: make test-coverage

      - name: Security
        run: make security

      - name: Build web
        run: make build

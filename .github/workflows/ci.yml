# CI: format, lint, typecheck, knip, test, security, build, e2e, lighthouse.
name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

jobs:
  lint-test-security-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install root dependencies (husky)
        run: npm ci

      - name: Install web dependencies
        run: cd web && npm ci --legacy-peer-deps

      - name: Format (ESLint --fix)
        run: make format

      - name: Lint
        run: make lint-ci

      - name: Typecheck
        run: make typecheck

      - name: Knip (unused files / deps)
        run: make knip

      - name: Test (with coverage thresholds)
        run: make test

      - name: Security
        run: make security

      - name: Build web
        run: make build

      - name: E2E smoke (Cypress)
        run: make e2e

      - name: Lighthouse CI (next start)
        run: cd web && npm run lighthouse
